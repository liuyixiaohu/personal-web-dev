name: GSC Snapshot

on:
  schedule:
    # 6:00 UTC — after cron-health (05:00). GSC data has a ~3-day lag.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch GSC snapshot
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: node scripts/fetch-gsc-snapshot.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/console/data/gsc-snapshot.json
          git diff --cached --quiet || git commit -m "chore: update gsc snapshot $(date -u +%Y-%m-%d)"
          git push
