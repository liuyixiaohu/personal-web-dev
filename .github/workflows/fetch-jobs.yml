name: Fetch Jobs

on:
  schedule:
    # 9:00 PM Pacific daily (UTC 04:00) — fallback after Tesla (2:30) and NPM (3:00)
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests>=2.31.0

      - name: Fetch jobs from monitor repos
        run: python scripts/fetch_jobs.py
        env:
          GITHUB_TOKEN: ${{ secrets.JOBS_PAT }}

      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch public/data/jobs.json
          git add public/console/data/jobs.json
          git diff --cached --quiet || git commit -m "chore: update job data $(date -u +%Y-%m-%d)"
          git push
