name: Fetch Events

on:
  schedule:
    # 02:00 UTC = 7 PM PDT (summer) / 6 PM PST (winter)
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/luma/requirements.txt

      - name: Fetch Luma events
        run: python scripts/luma/fetch_events.py

      - name: Fetch Eventbrite events
        run: python scripts/eventbrite/fetch_events.py

      - name: Merge and deduplicate
        run: python scripts/merge_events.py

      - name: Commit updated event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json public/data/luma_events.json public/data/eventbrite_events.json
          git diff --cached --quiet || git commit -m "chore: update event data $(date -u +%Y-%m-%d)"
          git push
