name: Fetch Luma Events

on:
  schedule:
    # Two triggers so "7 PM California" stays correct across DST:
    #   02:00 UTC = 7 PM PDT (summer, UTC-7)
    #   03:00 UTC = 7 PM PST (winter, UTC-8)
    # The timezone guard below skips the wrong one.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Timezone guard – only run if 7 PM in California
        id: tz
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger – skipping timezone check"
            exit 0
          fi
          HOUR=$(TZ='America/Los_Angeles' date +%H)
          if [ "$HOUR" != "19" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: it's ${HOUR}:xx in California, not 19:xx"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.tz.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.tz.outputs.skip != 'true'
        run: pip install -r scripts/luma/requirements.txt

      - name: Fetch events
        if: steps.tz.outputs.skip != 'true'
        run: python scripts/luma/fetch_events.py

      - name: Commit updated event data
        if: steps.tz.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json
          git diff --cached --quiet || git commit -m "chore: update event data $(date -u +%Y-%m-%d)"
          git push
