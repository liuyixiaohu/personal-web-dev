name: Fetch Luma Events

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC (8 PM PST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/luma/requirements.txt

      - name: Fetch events
        run: python scripts/luma/fetch_events.py

      - name: Commit updated event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "chore: update event data $(date -u +%Y-%m-%d)"
          git push
