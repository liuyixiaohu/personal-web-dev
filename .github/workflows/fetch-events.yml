name: Fetch Events

on:
  schedule:
    # 02:13 UTC = 7:13 PM PDT. Off-the-hour to dodge GitHub's top-of-hour
    # cron queue contention (recommended by GH docs). Switch to 03:13 UTC
    # after DST ends in November so PST landings stay near 7 PM PT.
    - cron: '13 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/luma/requirements.txt

      - name: Fetch Luma events
        run: python scripts/luma/fetch_events.py
        env:
          LUMA_API_URL: ${{ secrets.LUMA_API_URL }}

      - name: Merge events
        run: python scripts/merge_events.py

      - name: Commit updated event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json data/luma_events.json
          git diff --cached --quiet || git commit -m "chore: update event data $(date -u +%Y-%m-%d)"
          git push
