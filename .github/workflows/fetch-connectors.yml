name: Fetch Connectors

on:
  schedule:
    # Every 3 days at 03:00 UTC (~8 PM PT previous day).
    # GitHub may delay scheduled runs by 10-90 min during high load.
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/connectors/requirements.txt

      - name: Fetch connector directory
        run: python scripts/connectors/fetch_connectors.py

      - name: Commit and push updated connector data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/connectors.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update connector data $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main"
            git pull --rebase -X ours origin main
            sleep $((RANDOM % 15 + 5))
          done
          echo "Push failed after 5 attempts"
          exit 1
