name: Check

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'docs/brand-guidelines.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'stylelint.config.js'
      - 'AGENTS.md'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run required checks
        run: npm run check:all
