name: Cron Health Snapshot

on:
  schedule:
    # 5:00 UTC — after fetch-events (00:00) and fetch-jobs (04:00) finish
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch workflow run statuses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p public/console/data
          python scripts/fetch_cron_health.py > public/console/data/cron-health.json

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/console/data/cron-health.json
          git diff --cached --quiet || git commit -m "chore: update cron health snapshot $(date -u +%Y-%m-%d)"
          git push
